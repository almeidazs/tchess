version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - intrange
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain # switch-vs-if is a style call, not a defect
    misspell:
      locale: US
      ignore-rules: # Portuguese UI strings
        - empate
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true # many small accessors are self-explanatory
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/almeidazs/tchess
