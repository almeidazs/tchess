name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Test (race + coverage)
        if: runner.os == 'Linux'
        run: go test -race -coverprofile=coverage.out ./...
      - name: Perft(6) from the initial position
        if: runner.os == 'Linux'
        run: |
          nodes=$(go run ./cmd/tchess perft 6 | awk '/^nós:/ {print $2}')
          echo "perft(6) = $nodes"
          test "$nodes" = "119060324"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
