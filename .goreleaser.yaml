version: 2

project_name: tchess

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: tchess
    main: ./cmd/tchess
    binary: tchess
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE

checksum:
  name_template: checksums.txt

nfpms:
  - id: packages
    package_name: tchess
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Almeida
    maintainer: Almeida <me@almeidazs.com>
    homepage: https://github.com/almeidazs/tchess
    description: |-
      Two-player chess in the terminal.
      Pixel-art pieces, mouse and keyboard, clocks, themes, sounds and every
      FIDE rule.
    license: Apache-2.0
    section: games
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/tchess/README.md
      - src: LICENSE
        dst: /usr/share/licenses/tchess/LICENSE

dockers_v2:
  - id: image
    images:
      - ghcr.io/almeidazs/tchess
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: tchess
      org.opencontainers.image.description: Two-player chess in the terminal
      org.opencontainers.image.source: https://github.com/almeidazs/tchess
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  footer: |
    **Install**

    - Go: `go install github.com/almeidazs/tchess/cmd/tchess@{{ .Tag }}`
    - Docker: `docker run --rm -it ghcr.io/almeidazs/tchess:{{ .Version }}`
    - Debian/Ubuntu, Fedora, Alpine and Arch: the `.deb`, `.rpm`, `.apk` and `.pkg.tar.zst` packages below
